<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <h1>CineOro</h1>
    <div id="sidebar">
        {% block sidebar %}
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/movies/">All Movies</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'main:my_reviews' %}">My reviews</a></li>
                <li><form action="{% url 'logout' %}" method="post" >
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form></li>
            {% else %}
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'register' %}">Register</a></li>
            {% endif %}
        </ul>
        {% endblock %}
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
