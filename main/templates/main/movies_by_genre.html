{% extends "base_generic.html" %}
{% block content %}
    <h2>Movies: </h2>
    <ul>
        {% for movie in object_list %}
            <li>Movie title: {{ movie.title }}</br>
                Year: {{movie.release_year}}</br>
                Description: {{movie.description}}</br>
                Genre: {{movie.genre}}</br>
                <a href="/{{ movie.genre.name }}/{{ movie.title }}/">View reviews</a>
            </li>

        {% endfor %}
    </ul>
{% endblock %}
